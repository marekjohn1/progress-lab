<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><title>RepQuest — Progress Lab</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f6f7ff;background:#090d19}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 85% 0%,#28316a 0,transparent 42%),radial-gradient(ellipse at 0% 75%,#182d38 0,transparent 45%),#090d19}button,input,select{font:inherit}button{cursor:pointer;border:0}input,select{color:#fff;background:#1b2235;border:1px solid #36405b;border-radius:12px;padding:12px;min-width:0}input[type=number]{width:100%}h1,h2,h3,p{margin:0}h1{font-size:29px;letter-spacing:-1px}h2{font-size:22px;letter-spacing:-.5px}h3{font-size:16px}.app{max-width:520px;margin:auto;min-height:100dvh;padding:22px 18px 108px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:-.5px;font-size:21px}.logo-mark{background:#b6ff68;color:#101621;border-radius:14px;padding:9px;font-size:20px}.muted{color:#a2abc2;font-size:13px;line-height:1.5}.eyebrow{color:#b6ff68;font-size:11px;letter-spacing:2px;font-weight:900;text-transform:uppercase;margin-bottom:8px}.panel{background:#161d30d9;border:1px solid #303a54;border-radius:22px;padding:20px;margin:15px 0;box-shadow:0 10px 25px #0002}.hero{background:linear-gradient(125deg,#303f68,#17283b 75%);position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:15px;top:2px;font-size:105px;color:#ffffff0d}.btn{background:#b6ff68;color:#101521;border-radius:15px;padding:15px 18px;font-weight:900;width:100%;margin-top:12px}.btn.secondary{background:#29334a;color:#fff}.btn.ghost{background:transparent;border:1px solid #44516a;color:#fff}.btn.danger{background:#ff6f82;color:#1c0c12}.btn:disabled{opacity:.45}.pill{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:30px;background:#26314a;color:#e9ecfa;font-size:12px;font-weight:800}.coin{background:#b6ff6822;color:#c8ff8b}.stack{display:grid;gap:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{padding:14px;border-radius:17px;background:#222b42}.mini strong{display:block;font-size:25px;margin:5px 0}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:12px 0;border-radius:12px;background:#222c41;color:#aeb9ce;font-size:12px;font-weight:800}.day.on{background:#b6ff68;color:#0b1420}.choice{width:100%;text-align:left;padding:16px;background:#222b42;border:1px solid #38445c;color:#fff;border-radius:15px}.choice.selected{border:2px solid #b6ff68;background:#283a3a}.choice b{display:block;margin-bottom:5px}.choice small{color:#b0bad0}.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#141b2bf5;border-top:1px solid #343c54;display:flex;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:10}.nav button{flex:1;background:none;color:#9da8bf;font-size:11px;padding:5px 0;font-weight:800}.nav button.active{color:#b6ff68}.nav span{display:block;font-size:23px;margin-bottom:3px}.field{display:grid;gap:6px;margin:11px 0}.field label{color:#b5c0d4;font-size:12px;font-weight:700}.exercise{background:#1b2438;border:1px solid #36415a;border-radius:19px;padding:16px;margin:12px 0}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 45px;gap:7px;align-items:center;margin:9px 0}.setrow input{padding:10px 6px;text-align:center}.setrow.done{opacity:.58}.check{background:#35415a;color:#fff;border-radius:10px;height:41px}.check.on{background:#b6ff68;color:#142014}.smallbtn{background:#29364e;color:#e5ebf7;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:800}.spacer{height:12px}.line{height:1px;background:#344059;margin:14px 0}.empty{text-align:center;padding:35px 12px;color:#a6b1c6}.big{font-size:37px;font-weight:900;letter-spacing:-1.5px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#b6ff68;color:#101820;padding:12px 20px;border-radius:14px;font-weight:800;z-index:20;max-width:90%;text-align:center}.tag{font-size:11px;color:#b6ff68;font-weight:800}.bars{display:flex;align-items:end;gap:5px;height:100px;margin-top:15px}.bar{flex:1;background:#b6ff68;border-radius:6px 6px 0 0;min-height:3px}.overlay{position:fixed;inset:0;background:#090d19f7;z-index:15;overflow:auto}.overlay .app{padding-bottom:40px}button:focus-visible,input:focus-visible{outline:2px solid #b6ff68;outline-offset:2px}</style></head><body><div id="root"></div><script>
const KEY='repquest_v2';const templates={ppl:{name:'Push / Pull / Legs',desc:'6 tréninků • vysoká frekvence',days:['Push','Pull','Legs','Push','Pull','Legs',null]},upper:{name:'Upper / Lower',desc:'4 tréninky • vyvážená regenerace',days:['Upper','Lower',null,'Upper','Lower',null,null]},full:{name:'Full Body',desc:'3 tréninky • celé tělo',days:['Full Body',null,'Full Body',null,'Full Body',null,null]},custom:{name:'Vlastní split',desc:'Vytvoř si svůj rozvrh',days:['Trénink A',null,'Trénink B',null,'Trénink C',null,null]}};
const presets={'Push':[['Bench press',3],['Incline press',3],['Tlaky na ramena',3],['Upažování',3],['Triceps pushdown',3]],'Pull':[['Lat pulldown',3],['Přítahy v předklonu',3],['Seated row',3],['Face pull',3],['Biceps curl',3]],'Legs':[['Dřep',3],['Leg press',3],['Leg curl',3],['Výpony na lýtka',3]],'Upper':[['Bench press',3],['Lat pulldown',3],['Incline press',3],['Seated row',3],['Upažování',3],['Biceps curl',3]],'Lower':[['Dřep',3],['Rumunský mrtvý tah',3],['Leg extension',3],['Leg curl',3],['Výpony na lýtka',3]],'Full Body':[['Dřep',3],['Bench press',3],['Lat pulldown',3],['Leg curl',3],['Upažování',3]],'Trénink A':[['Bench press',3],['Lat pulldown',3]],'Trénink B':[['Dřep',3],['Leg curl',3]],'Trénink C':[['Incline press',3],['Seated row',3]]};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state={profile:null,split:null,days:[],workouts:[],coins:0,active:null,customExercises:{},...state};let page='home',onboardStep=0,chosen='upper',draftDays=[...templates.upper.days],toastTimer;const root=document.getElementById('root');const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dayNames=['Po','Út','St','Čt','Pá','So','Ne'];const todayIdx=()=>(new Date().getDay()+6)%7;const fmt=t=>new Date(t).toLocaleDateString('cs-CZ',{day:'numeric',month:'short'});const time=n=>`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;const toast=s=>{document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.textContent=s;document.body.append(x);clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.remove(),2500)};
function render(){if(!state.profile||!state.split){renderOnboard();return}const today=state.days[todayIdx()];root.innerHTML=`<div class="app"><div class="top"><div class="logo"><span class="logo-mark">▰</span> REPQUEST</div><span class="pill coin">🏋️ ${state.coins} RepCoins</span></div><main>${page==='home'?home():page==='plan'?plan():page==='history'?history():profile()}</main></div><nav class="nav">${[['home','⌂','Domů'],['plan','▦','Plán'],['history','↗','Progres'],['profile','◉','Profil']].map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${n}</button>`).join('')}</nav>${state.active?activeHTML():''}`;if(state.active)updateClock()}
function home(){const today=state.days[todayIdx()];const count=state.workouts.length;return `<div class="eyebrow">TVŮJ PROGRES ZAČÍNÁ TADY</div><h1>Ahoj, ${esc(state.profile.name)} <span style="color:#b6ff68">✦</span></h1><p class="muted">Každá série se počítá. Jdeme na to.</p><div class="panel hero"><span class="pill">${dayNames[todayIdx()]} • ${today?esc(today):'Regenerační den'}</span><div class="spacer"></div><h2>${today?'Dnes je tvůj den.':'Dnes odpočívej. '}</h2><p class="muted" style="margin-top:8px">${today?'Připraven posunout svůj výkon?':'Regenerace je součást progresu. Trénink můžeš spustit i dnes.'}</p><button class="btn" onclick="startWorkout(${JSON.stringify(today||'Volný trénink')})">▶ Spustit trénink</button></div><div class="grid2"><div class="mini"><div class="muted">Dokončené tréninky</div><strong>${count}</strong><span class="tag">Celkem</span></div><div class="mini"><div class="muted">Získané RepCoins</div><strong>${state.coins}</strong><span class="tag">+25 za trénink</span></div></div><div class="panel"><div class="row"><h3>Tvůj týden</h3><span class="tag">${esc(templates[state.split]?.name||'Vlastní plán')}</span></div><div class="stack" style="margin-top:14px">${state.days.map((d,i)=>`<div class="row"><span class="pill" style="min-width:42px;justify-content:center;${i===todayIdx()?'background:#b6ff68;color:#142014':''}">${dayNames[i]}</span><span style="flex:1">${esc(d||'Volno')}</span>${d?`<button class="smallbtn" onclick="startWorkout(${JSON.stringify(d)})">Start</button>`:'<span class="muted">—</span>'}</div>`).join('')}</div></div></div>`}
function plan(){return `<div class="eyebrow">TRÉNINKOVÝ KALENDÁŘ</div><h1>Můj plán</h1><p class="muted">Klikni na den a změň jeho trénink.</p><div class="panel"><div class="row"><h3>${esc(templates[state.split]?.name||'Vlastní')}</h3><button class="smallbtn" onclick="resetPlan()">Změnit split</button></div><div class="stack" style="margin-top:16px">${state.days.map((d,i)=>`<div class="field"><label>${dayNames[i]}</label><select onchange="changeDay(${i},this.value)"><option value="">Volno</option>${[...new Set([...Object.keys(presets),...state.days.filter(Boolean)])].map(x=>`<option value="${esc(x)}" ${d===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}</div></div><div class="panel"><h3>Vlastní názvy tréninků</h3><p class="muted">Přidej další typ dne, například „Push A“.</p><div class="row" style="margin-top:12px"><input id="newDay" placeholder="Název tréninku" style="flex:1"><button class="smallbtn" onclick="addDayType()">Přidat</button></div></div><div class="panel"><h3>Cviky v plánu</h3><p class="muted">Cviky upravíš přímo během tréninku; jejich skladba se uloží pro příště.</p></div>`}
function history(){const w=[...state.workouts].reverse();const totals=state.workouts.map(x=>Math.round(x.exercises.reduce((s,e)=>s+e.sets.filter(a=>a.done).reduce((v,a)=>v+(Number(a.kg)||0)*(Number(a.reps)||0),0),0)));const max=Math.max(1,...totals);return `<div class="eyebrow">ČÍSLA NELŽOU</div><h1>Tvůj progres</h1><p class="muted">Historie výkonů a objemu tréninku.</p><div class="grid2" style="margin-top:18px"><div class="mini"><div class="muted">Tréninky</div><strong>${w.length}</strong></div><div class="mini"><div class="muted">Odtrénované série</div><strong>${state.workouts.reduce((s,w)=>s+w.exercises.reduce((a,e)=>a+e.sets.filter(x=>x.done).length,0),0)}</strong></div></div><div class="panel"><h3>Tréninkový objem (kg × opakování)</h3><p class="muted">Posledních až 10 tréninků; orientační ukazatel.</p>${totals.length?`<div class="bars">${totals.slice(-10).map(v=>`<div class="bar" title="${v} kg" style="height:${Math.max(3,v/max*100)}%"></div>`).join('')}</div>`:'<div class="empty">Zatím žádná data</div>'}</div><h3>Historie tréninků</h3>${w.length?w.map(x=>`<div class="panel"><div class="row"><div><b>${esc(x.name)}</b><p class="muted">${fmt(x.end)} • ${time(x.duration)}</p></div><span class="pill coin">+25 🏋️</span></div><div class="line"></div>${x.exercises.map(e=>`<div class="row" style="margin:8px 0"><span class="muted">${esc(e.name)}</span><b style="font-size:12px">${e.sets.filter(s=>s.done).map(s=>`${s.kg}×${s.reps}`).join(' · ')||'—'}</b></div>`).join('')}</div>`).join(''):'<div class="empty">Dokonči první trénink a uvidíš svůj progres.</div>'}`}
function profile(){return `<div class="eyebrow">TVŮJ ÚČET</div><h1>Profil</h1><div class="panel"><div class="field"><label>Jméno</label><input value="${esc(state.profile.name)}" onchange="state.profile.name=this.value.trim()||'Sportovec';save();render()"></div><p class="muted">Data jsou uložena pouze v tomto prohlížeči. Přihlášení přes Google, Apple a e-mail zatím není aktivní.</p></div><div class="panel"><h3>Záloha dat</h3><p class="muted">Exportuj záznamy, aby ses o ně nepřipravil při smazání dat prohlížeče.</p><button class="btn secondary" onclick="exportData()">↓ Exportovat zálohu JSON</button><div class="field"><label>Obnovit ze zálohy</label><input type="file" accept="application/json,.json" onchange="importData(this.files[0])"></div></div><div class="panel"><h3>O aplikaci</h3><p class="muted">RepQuest • Progress Lab 2.0<br>Lokální beta verze</p></div>`}
function renderOnboard(){const tpl=templates[chosen];root.innerHTML=`<div class="app"><div class="top"><div class="logo"><span class="logo-mark">▰</span> REPQUEST</div><span class="pill">${onboardStep+1}/3</span></div><div class="eyebrow">TVŮJ NOVÝ FITNESS PARŤÁK</div><h1>${['Začni svou cestu.','Vyber si svůj split.','Nastav tréninkové dny.'][onboardStep]}</h1><p class="muted" style="margin:10px 0 24px">${['Vytvoř si profil a začni sbírat RepCoins.','Vyber doporučenou strukturu nebo si sestav vlastní.','Rozvrh můžeš kdykoliv změnit.'][onboardStep]}</p>${onboardStep===0?`<div class="panel"><div class="field"><label>Jak ti máme říkat?</label><input id="name" maxlength="35" placeholder="Tvoje jméno" value="${esc(state.profile?.name||'')}"></div><p class="muted">Zatím lokální profil bez e-mailové registrace.</p><button class="btn" onclick="nextProfile()">Pokračovat →</button></div>`:onboardStep===1?`<div class="stack">${Object.entries(templates).map(([id,t])=>`<button class="choice ${chosen===id?'selected':''}" onclick="choose('${id}')"><b>${esc(t.name)} ${chosen===id?'✓':''}</b><small>${esc(t.desc)}</small></button>`).join('')}</div><button class="btn" onclick="onboardStep=2;render()">Pokračovat →</button><button class="btn ghost" onclick="onboardStep=0;render()">Zpět</button>`:`<div class="panel"><h3>${esc(tpl.name)}</h3><p class="muted">Vyber typ tréninku pro každý den.</p><div class="stack" style="margin-top:16px">${draftDays.map((d,i)=>`<div class="field"><label>${dayNames[i]}</label><select onchange="draftDays[${i}]=this.value||null"><option value="">Volno</option>${[...new Set([...tpl.days.filter(Boolean),...Object.keys(presets)])].map(x=>`<option value="${esc(x)}" ${d===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}</div></div><button class="btn" onclick="finishOnboard()">Potvrdit můj plán ✓</button><button class="btn ghost" onclick="onboardStep=1;render()">Zpět</button>`}</div>`}
function nextProfile(){const n=document.getElementById('name').value.trim();if(!n)return toast('Vyplň jméno');state.profile={name:n};save();onboardStep=1;render()}function choose(id){chosen=id;draftDays=[...templates[id].days];render()}function finishOnboard(){if(!draftDays.some(Boolean))return toast('Vyber alespoň jeden tréninkový den');state.split=chosen;state.days=[...draftDays];save();page='home';render();toast('Plán je připraven!')}function resetPlan(){if(!confirm('Změnit split? Historie zůstane zachována.'))return;onboardStep=1;chosen=state.split||'upper';draftDays=[...state.days];state.split=null;save();render()}function go(p){page=p;render()}function changeDay(i,v){state.days[i]=v||null;save();render()}function addDayType(){let v=document.getElementById('newDay').value.trim().slice(0,40);if(!v)return;presets[v]=[];state.customExercises[v]=[];save();render();toast('Typ tréninku přidán')}
function getExercises(name){const base=state.customExercises[name]||presets[name]||[];return base.map(([n,c])=>({id:crypto.randomUUID(),name:n,sets:Array.from({length:c},()=>({kg:'',reps:'',done:false}))}))}function startWorkout(name){if(state.active){toast('Nejprve dokonči rozběhnutý trénink');return}state.active={name,start:Date.now(),exercises:getExercises(name)};save();render()}function activeHTML(){const a=state.active;return `<div class="overlay"><div class="app"><div class="top"><div class="logo"><span class="logo-mark">▰</span> TRÉNINK</div><span class="pill coin">🏋️ +25</span></div><div class="eyebrow">PRÁVĚ TRÉNUJEŠ</div><h1>${esc(a.name)}</h1><div class="row" style="margin-top:14px"><div><p class="muted">Uplynulý čas</p><div class="big" id="clock">00:00</div></div><span class="pill" id="setCount">${a.exercises.reduce((s,e)=>s+e.sets.filter(x=>x.done).length,0)} sérií hotovo</span></div><div class="spacer"></div>${a.exercises.map((e,i)=>`<div class="exercise"><div class="row"><h3>${esc(e.name)}</h3><button class="smallbtn" onclick="removeExercise(${i})">Odebrat</button></div><p class="muted" style="margin-top:5px">Zapisuj váhu a opakování. ✓ označí hotovou sérii.</p><div class="setrow" style="margin-top:12px"><span class="muted">#</span><span class="muted" style="text-align:center">kg</span><span class="muted" style="text-align:center">Opak.</span><span class="muted">Hotovo</span></div>${e.sets.map((s,j)=>`<div class="setrow ${s.done?'done':''}"><b>${j+1}</b><input type="number" inputmode="decimal" min="0" step="0.5" placeholder="0" value="${esc(s.kg)}" onchange="editSet(${i},${j},'kg',this.value)"><input type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="${esc(s.reps)}" onchange="editSet(${i},${j},'reps',this.value)"><button class="check ${s.done?'on':''}" onclick="toggleSet(${i},${j})">✓</button></div>`).join('')}<div class="row" style="margin-top:14px"><button class="smallbtn" onclick="addSet(${i})">+ Série</button><button class="smallbtn" onclick="removeSet(${i})">− Série</button></div></div>`).join('')}<div class="panel"><h3>Přidat cvik</h3><div class="field"><input id="exerciseName" placeholder="Např. Incline DB press" list="exercises"><datalist id="exercises">${[...new Set(Object.values(presets).flat().map(x=>x[0]))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div><button class="btn secondary" onclick="addExercise()">+ Přidat cvik</button></div><button class="btn" onclick="finishWorkout()">✓ Dokončit trénink</button><button class="btn ghost" onclick="cancelWorkout()">Zrušit trénink</button></div></div>`}
function editSet(i,j,k,v){state.active.exercises[i].sets[j][k]=v;save()}function toggleSet(i,j){let s=state.active.exercises[i].sets[j];if(!s.done&&(!Number.isFinite(Number(s.kg))||s.kg===''||!Number.isFinite(Number(s.reps))||Number(s.reps)<=0||Number(s.kg)<0))return toast('Vyplň platnou váhu a opakování');s.done=!s.done;save();render()}function addSet(i){const sets=state.active.exercises[i].sets;const last=sets.at(-1);sets.push({kg:last?.kg||'',reps:last?.reps||'',done:false});save();render()}function removeSet(i){const s=state.active.exercises[i].sets;if(s.length>1)s.pop();save();render()}function addExercise(){const n=document.getElementById('exerciseName').value.trim().slice(0,65);if(!n)return toast('Napiš název cviku');state.active.exercises.push({id:crypto.randomUUID(),name:n,sets:[{kg:'',reps:'',done:false}]});save();render()}function removeExercise(i){if(!confirm('Odebrat cvik?'))return;state.active.exercises.splice(i,1);save();render()}function updateClock(){const e=document.getElementById('clock');if(e&&state.active)e.textContent=time(Math.max(0,Math.floor((Date.now()-state.active.start)/1000)))}setInterval(updateClock,1000);
function finishWorkout(){const a=state.active;const done=a.exercises.reduce((s,e)=>s+e.sets.filter(x=>x.done).length,0);if(!done)return toast('Nejdřív dokonči alespoň jednu sérii');if(!confirm(`Dokončit trénink? Hotových sérií: ${done}.`))return;const end=Date.now();state.workouts.push({...a,end,duration:Math.floor((end-a.start)/1000)});state.coins+=25;state.customExercises[a.name]=a.exercises.map(e=>[e.name,e.sets.length]);state.active=null;save();page='history';render();toast('Trénink hotov! +25 RepCoins 🏋️')}function cancelWorkout(){if(!confirm('Zrušit trénink bez uložení?'))return;state.active=null;save();render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='repquest-zaloha.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.workouts)||!Array.isArray(data.days)||!data.profile)throw Error();if(!confirm('Nahradit současná data zálohou?'))return;state=data;save();render();toast('Záloha obnovena')}catch{toast('Neplatný soubor zálohy')}}render();
</script></body></html>
